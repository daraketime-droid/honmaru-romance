<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24263b">
<title>本丸恋愛シミュレーター</title>
<style>
:root{--bg:#f5f1e9;--card:#fffdf8;--ink:#28283a;--muted:#706d7b;--accent:#873f59;--line:#ded6cb;--gold:#b58a46}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.6}
header{background:#24263b;color:#fff;padding:22px 18px 18px;text-align:center;border-bottom:4px solid var(--gold)}
header h1{font-size:1.3rem;margin:0 0 4px;letter-spacing:.08em}header p{margin:0;color:#e3dce2;font-size:.83rem}
main{max-width:760px;margin:0 auto;padding:16px 13px 42px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin:0 0 14px;box-shadow:0 3px 12px #30243a0a}
h2{font-size:1.08rem;margin:0 0 10px}h3{font-size:.98rem;margin:0 0 7px}.sub{color:var(--muted);font-size:.88rem;margin:4px 0 12px}
button,select{font:inherit}button{border:1px solid #c9b8b7;background:#fff9f7;color:var(--ink);border-radius:12px;padding:12px 13px;min-height:46px;cursor:pointer;text-align:left;width:100%;margin:5px 0}
button.primary{background:var(--accent);border-color:var(--accent);color:white;text-align:center;font-weight:700}button.secondary{background:#f1e8e5}button:active{transform:scale(.99)}
.grid{display:grid;grid-template-columns:1fr;gap:7px}.sword{display:flex;justify-content:space-between;gap:12px;align-items:center}.sword small{color:var(--muted)}.pill{display:inline-block;background:#eee6dc;border-radius:99px;padding:3px 9px;font-size:.78rem;white-space:nowrap}
.status{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{background:#f7f0e9;border-radius:10px;padding:10px}.stat b{display:block;font-size:.85rem}.stat span{font-size:1.15rem;font-weight:700;color:var(--accent)}
.log{white-space:pre-wrap;background:#f8f4ef;border-radius:10px;padding:12px;font-size:.9rem;min-height:56px}.hidden{display:none!important}.ending{border:2px solid var(--accent);background:#fff4f2}.note{font-size:.8rem;color:var(--muted)}.bar{height:7px;background:#e4dcd3;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--accent)}
@media(min-width:560px){.grid.two{grid-template-columns:1fr 1fr}.status{grid-template-columns:repeat(3,minmax(0,1fr))}main{padding-top:22px}}
</style>
</head>
<body>
<header><h1>本丸恋愛シミュレーター</h1><p>朝の選択から、刀剣男士との関係が変わっていく。</p></header>
<main>
<section id="start" class="panel">
<h2>はじめに</h2>
<p>初期刀を一振り選んでください。全員の初期好感度は30です。選択によって、支えになってくれることもあれば、取り返しのつかない結末を迎えることもあります。</p>
<div id="starterChoices" class="grid two"></div>
<p class="note">このゲームはファンメイドの試作版です。選択肢・好感度・エンディングを試すためのものです。</p>
</section>
<section id="game" class="hidden">
<div class="panel">
<div class="sword"><h2 id="dayTitle">一日目・朝</h2><span class="pill" id="starterLabel"></span></div>
<p id="sceneText" class="sub"></p>
<div id="status" class="status"></div>
</div>
<div id="choicePanel" class="panel"><h2 id="choiceTitle">今日、誰と過ごす？</h2><p id="choiceHint" class="sub"></p><div id="choices" class="grid two"></div></div>
<div id="resultPanel" class="panel hidden"><h2 id="resultTitle">会話</h2><div id="resultText" class="log"></div><div id="resultChoices"></div></div>
<div id="endingPanel" class="panel ending hidden"><h2 id="endingTitle">結末</h2><p id="endingText"></p><button class="primary" onclick="restart()">最初から遊ぶ</button></div>
<div class="panel"><h2>本日の記録</h2><div id="log" class="log">まだ記録はありません。</div><button class="secondary" onclick="restart()">最初からやり直す</button></div>
</section>
</main>
<script>
const names=["加州清光","山姥切国広","陸奥守吉行","蜂須賀虎徹","歌仙兼定"];
const others=["山姥切長義","大和守安定","肥前忠広","南海太郎朝尊","浦島虎徹","長曽祢虎徹"];
const all=[...names,...others];
let starter="",day=1,aff={},log=[],phase="start",target="",warnings=0,visitedOther=false,otherVisits=0,ended=false,routeTarget="";
const $=id=>document.getElementById(id);
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function addLog(s){log.unshift("【"+day+"日目】"+s);$("log").textContent=log.slice(0,8).join("\n")}
function renderStart(){$("starterChoices").innerHTML=names.map(n=>`<button onclick="chooseStarter('${n}')"><b>${n}</b><br><small>初期好感度 30</small></button>`).join("")}
function chooseStarter(n){starter=n;aff={};all.forEach(x=>aff[x]=30);day=1;warnings=0;visitedOther=false;otherVisits=0;ended=false;log=[];phase="choose";$("start").classList.add("hidden");$("game").classList.remove("hidden");$("starterLabel").textContent="初期刀："+starter;addLog(starter+"を初期刀に選んだ。");showDay()}
function renderStatus(){$("status").innerHTML=all.map(n=>`<div class="stat"><b>${esc(n)}</b><span>${aff[n]}</span><div class="bar"><i style="width:${Math.max(0,Math.min(100,aff[n]))}%"></i></div></div>`).join("")}
function showDay(){if(ended)return;phase="choose";$("dayTitle").textContent=day+"日目・朝";$("sceneText").textContent=day===1?starter+"と朝の挨拶を交わした。今日は誰と過ごそうか。":"朝になった。"+starter+"はいつものように、あなたの様子をうかがっている。";renderStatus();$("choicePanel").classList.remove("hidden");$("resultPanel").classList.add("hidden");$("endingPanel").classList.add("hidden");$("choiceTitle").textContent="今日、誰と過ごす？";$("choiceHint").textContent="初期刀以外を選んでも、あとで初期刀と話す機会があります。";$("choices").innerHTML=all.map(n=>`<button onclick="chooseTarget('${n}')"><div class="sword"><b>${esc(n)}</b><span class="pill">好感度 ${aff[n]}</span></div></button>`).join("")}
function chooseTarget(n){if(ended)return;target=n;routeTarget=n;if(n!==starter){visitedOther=true;otherVisits++;}addLog(n+"と過ごすことにした。");$("choicePanel").classList.add("hidden");$("resultPanel").classList.remove("hidden");$("resultTitle").textContent=n+"との時間";$("resultText").textContent=target===starter?starter+"は、あなたが自分を選んだことに少し安心したようだ。":"あなたは"+n+"と過ごした。ふと視線を感じる。"+starter+"は何も言わない。";$("resultChoices").innerHTML=`<button onclick="reply(1)">「君と話したかった」</button><button onclick="reply(0)">いつも通りに会話する</button><button onclick="reply(-1)">「また今度にしよう」</button>`}
function reply(delta){if(ended)return;aff[target]=Math.max(-100,Math.min(120,aff[target]+delta*5));let line=delta>0?target+"の表情が和らいだ。好感度 +5。":delta<0?target+"は少し寂しそうに目を伏せた。好感度 -5。":target+"と穏やかな時間を過ごした。好感度の変化はない。";if(target!==starter&&delta>0)line+="\n"+starter+"の視線が気になる。";addLog(line);$("resultText").textContent=line;renderStatus();$("resultChoices").innerHTML='<button class="primary" onclick="night()">夜になる</button>';phase="night"}
function night(){if(ended)return;const a=aff[starter],n=starter;let end=null;
 if(n==="加州清光"&&a<=40)end=["死亡エンド","「なんで愛してくれないの」清光は笑っているのに、その目は少しも笑っていなかった。"];
 else if(n==="山姥切国広"&&a<=10)end=["死亡エンド","「やはり写しなど……はは、あんたも値踏みするんだな」国広は自嘲するように笑った。"];
 else if(n==="陸奥守吉行"&&a<0)end=["死亡エンド","守ると決めた相手を失った陸奥守は、もう戻ってこなかった。"];
 else if(n==="蜂須賀虎徹"&&a<=10)end=["追放エンド","「主として認めるわけにはいかない」蜂須賀は静かに告げた。"];
 else if(n==="歌仙兼定"&&a<0)end=["追放エンド","「風雅を解さぬ主に仕えるのは、ここまでだ」歌仙は本丸を去った。"];
 else if(n==="歌仙兼定"&&a<=20)end=["疎遠エンド","歌仙はあなたを避けるようになった。話しかけても、返事は短い。"];
 else if(n==="加州清光"&&a>50&&visitedOther)end=["監禁エンド","「なんで俺のこと愛していたんじゃないの？ なんで、なんで、なんで」清光はあなたを離さなかった。"];
 else if(n==="山姥切国広"&&a>=80&&visitedOther&&routeTarget!=="山姥切長義")end=["神隠しエンド","国広はあなたの手を取る。「もう、誰にも渡さない」景色が白くほどけていく。"];
 else if(n==="蜂須賀虎徹"&&routeTarget==="長曽祢虎徹")end=["監禁エンド","長曽祢の名を聞いた瞬間、蜂須賀の表情から温度が消えた。"];
 else if(n==="蜂須賀虎徹"&&a>100)end=["神隠しエンド","蜂須賀はあなたを抱き寄せる。「この先は、誰にも邪魔させない」"];
 else if(n==="歌仙兼定"&&a===90&&visitedOther)end=["死亡エンド","「僕を選ばないのなら、せめて最期は美しく」歌仙は静かに刃を抜いた。"];
 else if(n==="歌仙兼定"&&a>=90)end=["執着エンド","歌仙の溜め込んだ想いが一気にあふれた。逃げ道は、もうない。"];
 else if(n==="陸奥守吉行"&&a>=100)end=["結婚エンド","「わしと一緒に、新しい時代を作っていこうぜよ！」陸奥守はあなたの手を取った。"];
 else if(n==="陸奥守吉行"&&a>=60&&visitedOther){warnings++;if(warnings===1){addLog("陸奥守は寂しそうに笑った。「わしのことも、忘れんといてくれよ」");}else end=["監禁エンド","「一度は我慢した。けんど、もう二度目はないぜよ」陸奥守はあなたを引き留めた。"];}
 else if(n==="山姥切国広"&&routeTarget==="山姥切長義"){addLog("国広は苦しそうに目を伏せた。それでも、あなたを引き留めなかった。");}
 else if(n==="加州清光"&&a>=40&&a<=50){addLog("清光はあなたの選択を見守っている。今は、まだ大丈夫そうだ。");}
 else if(n==="山姥切国広"&&a<60){addLog("国広はまだ自分の想いに名前をつけられずにいる。今は他の誰かを応援してくれる。");}
 else if(n==="歌仙兼定"&&a<90){addLog("歌仙は一歩引いて、あなたの選択を尊重している。");}
 else if(n==="蜂須賀虎徹"&&a>=50&&a<=60&&aff["浦島虎徹"]>=30){addLog("蜂須賀は浦島のことを気にかけながら、あなたを見守っている。");}
 else if(n==="蜂須賀虎徹"&&aff["浦島虎徹"]<30){aff[n]=Math.max(-100,aff[n]-5);addLog("浦島を気にかける蜂須賀の好感度が下がった。好感度 -5。");}
 if(end){finish(end[0],end[1]);return}
 day++;showDay()}
function finish(title,txt){ended=true;$("choicePanel").classList.add("hidden");$("resultPanel").classList.add("hidden");$("endingPanel").classList.remove("hidden");$("endingTitle").textContent=title;$("endingText").textContent=txt;addLog("【"+title+"】"+txt);$("dayTitle").textContent="物語の結末";renderStatus()}
function restart(){$("game").classList.add("hidden");$("start").classList.remove("hidden");$("endingPanel").classList.add("hidden");renderStart();window.scrollTo(0,0)}
renderStart();
</script>
</body>
</html>
